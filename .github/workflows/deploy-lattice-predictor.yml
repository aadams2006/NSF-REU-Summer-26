name: Deploy Lattice GCN Predictor

on:
  push:
    branches:
      - main
    paths:
      - "apps/lattice_predictor/**"
      - ".github/workflows/deploy-lattice-predictor.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lattice-gcn-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/lattice_predictor/package-lock.json

      - name: Install dependencies
        working-directory: apps/lattice_predictor
        run: npm ci

      - name: Test browser inference
        working-directory: apps/lattice_predictor
        run: npm test

      - name: Build website
        working-directory: apps/lattice_predictor
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/lattice_predictor/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
